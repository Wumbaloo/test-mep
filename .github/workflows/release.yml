name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Checkout develop
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Back-merge main into develop
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit -m "chore: merge main into develop after release" || {
            status=$?
            if git diff --quiet HEAD origin/main; then
              echo "develop is already up to date with main."
              exit 0
            fi
            exit "$status"
          }
          git push origin develop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
